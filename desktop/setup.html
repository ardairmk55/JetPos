<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>POSHANE — Sunucu bağlantısı</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #252936; font-family: "Segoe UI", system-ui, sans-serif; color: #1A1D27; }
  .card { background: #fff; border-radius: 14px; padding: 28px; width: min(440px, 92vw); }
  h1 { margin: 0 0 4px; font-size: 26px; } h1 span { color: #B65E0F; }
  p { color: #5A6072; font-size: 14px; } label { font-size: 12px; font-weight: 600; color: #5A6072; }
  input[type=text] { width: 100%; box-sizing: border-box; min-height: 44px; border: 1px solid #DDE0E7; border-radius: 8px; padding: 0 12px; font-size: 15px; margin: 4px 0 12px; }
  button { width: 100%; min-height: 48px; border: 0; border-radius: 8px; background: #F28C28; font-weight: 700; font-size: 15px; cursor: pointer; }
  .err { color: #B42F2F; font-weight: 600; }
</style>
</head>
<body>
<div class="card">
  <h1>JET<span>POS</span></h1>
  <p>Yerel ağdaki POSHANE sunucusunun adresini girin (kurulum sonunda gösterilen adres, ör. http://192.168.1.10:8000).</p>
  <p class="err" id="err"></p>
  <label for="server">Sunucu adresi</label>
  <input type="text" id="server" placeholder="http://192.168.1.10:8000" autofocus>
  <label><input type="checkbox" id="kiosk"> Tam ekran (kiosk) modunda aç — mutfak ekranı/kasa için</label>
  <p></p>
  <button id="save">Kaydet ve bağlan</button>
</div>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get("error")) document.getElementById("err").textContent = "Sunucuya bağlanılamadı (" + q.get("error") + "). Adresi ve ağ bağlantısını kontrol edin.";
  window.jetposDesktop.getConfig().then((c) => { document.getElementById("server").value = c.server || ""; document.getElementById("kiosk").checked = !!c.kiosk; });
  document.getElementById("save").onclick = async () => {
    try { await window.jetposDesktop.saveConfig({ server: document.getElementById("server").value, kiosk: document.getElementById("kiosk").checked }); }
    catch (e) { document.getElementById("err").textContent = "Geçersiz adres. http:// ile başlamalı."; }
  };
</script>
</body>
</html>
