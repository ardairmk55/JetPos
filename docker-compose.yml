# POSHANE üretim kurulumu: uygulama + zamanlayıcı + Caddy (otomatik HTTPS).
# Uygulama portu dışarıya AÇILMAZ; yalnızca Caddy üzerinden erişilir.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    # Bazı VPS'lerde sağlayıcının DNS'ine konteynerden ulaşılamıyor; genel DNS kullan.
    dns: [1.1.1.1, 8.8.8.8]
    volumes:
      - poshane-data:/data
    expose:
      - "8000"
    healthcheck:
      # Django ALLOWED_HOSTS yalnızca alan adını kabul eder; kontrol isteği alan adını Host başlığı olarak gönderir.
      test: ["CMD", "python", "-c", "import os, urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8000/api/ping', headers={'Host': os.environ.get('POSHANE_DOMAIN', 'poshane.net')}), timeout=4)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 90s

  scheduler:
    build: .
    restart: unless-stopped
    env_file: .env
    dns: [1.1.1.1, 8.8.8.8]
    volumes:
      - poshane-data:/data
    depends_on:
      - app
    command: ["python", "manage.py", "jetpos_scheduler"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    dns: [1.1.1.1, 8.8.8.8]
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      - POSHANE_DOMAIN=${POSHANE_DOMAIN:-poshane.net}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  poshane-data:
  caddy-data:
  caddy-config:
